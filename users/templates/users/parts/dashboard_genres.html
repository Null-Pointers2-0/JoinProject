{% extends 'users/types/user_admin.html' %}

{% block parts_content %}
<div class="container-fluid mt-4">
    {% include 'users/parts/filter_form.html' %}
    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="card-title mb-0"><i class="fas fa-chart-pie me-2"></i> Genre Distribution</h5>
                </div>
                <div class="card-body p-4">
                    <div style="height: 400px; position: relative;">
                        <canvas id="genreChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-light py-3">
                    <h5 class="card-title mb-0">Top Genres Data</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Genre</th>
                                    <th class="text-end pe-3">Views</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for label, value in genre_stats.items %}
                                <tr>
                                    <td class="ps-3">{{ label }}</td>
                                    <td class="text-end pe-3 fw-bold">{{ value }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('genreChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: {{ genre_stats.labels|safe }},
            datasets: [{
                data: {{ genre_stats.values|safe }},
                backgroundColor: ['#2c3e50', '#3498db', '#95a5a6', '#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e'],
                borderWidth: 2,
                borderColor: '#ffffff'
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { padding: 20, font: { size: 12 } } }
            }
        }
    });
});
</script>
{% endblock %}
