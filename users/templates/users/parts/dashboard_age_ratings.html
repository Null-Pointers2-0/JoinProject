{% extends 'users/types/user_admin.html' %}

{% block parts_content %}
<div class="container-fluid mt-4">
    {% include 'users/parts/filter_form.html' %}
    <div class="row">
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white py-3">
                    <h5 class="card-title mb-0"><i class="fas fa-user-shield"></i> Views by Age Rating</h5>
                </div>
                <div class="card-body p-4">
                    <div style="height: 400px; position: relative;">
                        <canvas id="ageChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-light py-3">
                    <h5 class="card-title mb-0">Age Rating Table</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Rating</th>
                                    <th class="text-end pe-3">Visualizations</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for label, value in age_stats.items %}
                                <tr>
                                    <td class="ps-3">{{ label }}</td>
                                    <td class="text-end pe-3 fw-bold">{{ value }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('ageChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ age_stats.labels|safe }},
            datasets: [{
                label: 'Visualizations',
                data: {{ age_stats.values|safe }},
                backgroundColor: '#3498db',
                borderRadius: 5
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: { beginAtZero: true, grid: { display: false } },
                y: { grid: { display: false } }
            }
        }
    });
});
</script>
{% endblock %}
