<form method="GET" class="row g-3 mb-4 align-items-end">
    <div class="col-md-4">
        <label for="start" class="form-label">Fecha Inicio</label>
        <input type="date" name="start" id="start" class="form-control" value="{{ filters.start }}">
    </div>
    <div class="col-md-4">
        <label for="end" class="form-label">Fecha Fin</label>
        <input type="date" name="end" id="end" class="form-control" value="{{ filters.end }}">
    </div>
    <div class="col-md-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a href="{{ request.path }}" class="btn btn-outline-secondary">Limpiar</a>
    </div>
</form>
