{% extends 'users/base_profile.html' %}
{% load i18n %}

{% block content_admin %}
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @media (max-width: 768px) {
            .chart-container {
                height: 300px !important;
            }
            .filter-form {
                flex-direction: column !important;
                align-items: stretch !important;
            }
        }
    </style>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}"
               href="{% url 'admin_dashboard' %}">{% trans 'Overview' %}</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard_genres' %}active{% endif %}"
               href="{% url 'admin_dashboard_genres' %}">{% trans 'Genres' %}</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard_age_ratings' %}active{% endif %}"
               href="{% url 'admin_dashboard_age_ratings' %}">{% trans 'Age Ratings' %}</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'admin_dashboard_directors' %}active{% endif %}"
               href="{% url 'admin_dashboard_directors' %}">{% trans 'Directors' %}</a>
        </li>
    </ul>

    <!-- Contenido de la tab activa -->
    <div class="tab-content-area mt-3">
        {% block parts_content %}{% endblock %}
    </div>

{% endblock %}
