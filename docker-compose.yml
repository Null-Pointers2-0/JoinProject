services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: joinproject_db
      POSTGRES_USER: mi_usuario
      POSTGRES_PASSWORD: mi_password_seguro
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 1. Agrega esto para que Postgres reporte cuándo está listo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mi_usuario -d joinproject_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  join_p:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: